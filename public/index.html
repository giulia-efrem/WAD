<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morsel, food delivery</title>
<meta name="description" content="Order from the best local restaurants and track your delivery live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/styles.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <mask id="mk-bite" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40">
      <rect width="40" height="40" fill="#fff"/>
      <circle cx="29" cy="10.5" r="5.6" fill="#000"/>
      <circle cx="31.8" cy="18" r="4.6" fill="#000"/>
    </mask>
  </defs>
</svg>

<header class="topbar">
  <div class="wrap topbar-inner">
    <button class="logo" type="button" data-act="home" aria-label="Morsel, back to restaurants">
      <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" style="fill:var(--brand)"/><circle cx="18.5" cy="21" r="11.5" style="fill:var(--brand-ink)" mask="url(#mk-bite)"/><circle cx="31.4" cy="29.6" r="2.5" style="fill:var(--accent)"/></svg>
      <span class="wordmark">morsel</span>
    </button>
    <button class="addr-btn" type="button" data-act="addr" id="addr-btn">
      <span class="pin"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
      <span class="addr-text"><small>Deliver to</small><strong id="addr-label">Add delivery address</strong></span>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="top-actions">
      <a class="icon-btn" href="/admin" id="admin-link" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg><span class="lbl">Photos</span></a>
      <button class="icon-btn" type="button" data-act="account-btn" id="acct-btn"></button>
      <button class="icon-btn" type="button" data-act="cart" id="cart-btn" aria-label="Open your bag">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span class="badge" id="cart-count" hidden>0</span>
      </button>
    </div>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="site-footer">
  <div class="wrap">
    <span class="logo" aria-hidden="true">
      <svg class="logo-mark" viewBox="0 0 40 40"><rect width="40" height="40" rx="12" style="fill:var(--brand)"/><circle cx="18.5" cy="21" r="11.5" style="fill:var(--brand-ink)" mask="url(#mk-bite)"/><circle cx="31.4" cy="29.6" r="2.5" style="fill:var(--accent)"/></svg>
      <span class="wordmark">morsel</span>
    </span>
    <p>Morsel is a demo food delivery app. Restaurants, prices, couriers and orders are fictional, and no payment is ever taken. Your account, addresses and orders are saved to your Morsel account, so they follow you to any device.</p>
  </div>
</footer>

<button class="cartbar" id="cartbar" type="button" data-act="cart" hidden></button>
<div class="overlay" id="overlay" data-act="close-drawer"></div>
<aside class="drawer" id="drawer" aria-labelledby="drawer-title" role="dialog" aria-modal="true">
  <div class="drawer-head">
    <div><h2 id="drawer-title">Your bag</h2><p id="drawer-sub"></p></div>
    <button class="close-btn" type="button" data-act="close-drawer" aria-label="Close bag"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
